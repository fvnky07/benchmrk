# Dependabot configuration for benchmrk Turborepo monorepo
# SECURITY-ONLY MODE: Only creates PRs for security vulnerabilities
# Version updates are disabled to reduce noise and focus on critical fixes

version: 2
updates:
  # Root workspace dependencies - SECURITY ONLY
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 0 # Disable version update PRs
    commit-message:
      prefix: 'security'
      include: 'scope'
    labels:
      - 'security'
      - 'dependencies'
      - 'root'

  # Website app (Next.js) - SECURITY ONLY
  - package-ecosystem: 'npm'
    directory: '/apps/website'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 0 # Disable version update PRs
    commit-message:
      prefix: 'security'
      include: 'scope'
    labels:
      - 'security'
      - 'dependencies'
      - 'website'

  # Native/Mobile app (React Native + Expo) - SECURITY ONLY
  - package-ecosystem: 'npm'
    directory: '/apps/native'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 0 # Disable version update PRs
    commit-message:
      prefix: 'security'
      include: 'scope'
    labels:
      - 'security'
      - 'dependencies'
      - 'mobile'

  # Backend package (Convex) - SECURITY ONLY
  - package-ecosystem: 'npm'
    directory: '/packages/backend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 0 # Disable version update PRs
    commit-message:
      prefix: 'security'
      include: 'scope'
    labels:
      - 'security'
      - 'dependencies'
      - 'backend'

  # TypeScript config package - SECURITY ONLY
  - package-ecosystem: 'npm'
    directory: '/packages/typescript-config'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 0 # Disable version update PRs
    commit-message:
      prefix: 'security'
      include: 'scope'
    labels:
      - 'security'
      - 'dependencies'
      - 'config'

  # GitHub Actions dependencies - SECURITY ONLY
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 0 # Disable version update PRs
    commit-message:
      prefix: 'security'
      include: 'scope'
    labels:
      - 'security'
      - 'dependencies'
      - 'github-actions'

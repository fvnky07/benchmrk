# Generated by OpenCode AI - Dependabot Configuration - 2026-02-12
# Dependabot configuration for benchmrk Turborepo monorepo
# Monitors all package.json files across apps/ and packages/

version: 2
updates:
  # Root workspace dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'root'
    groups:
      turborepo:
        patterns:
          - 'turbo*'
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'
      prettier:
        patterns:
          - 'prettier*'

  # Website app (Next.js)
  - package-ecosystem: 'npm'
    directory: '/apps/website'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'website'
    groups:
      nextjs:
        patterns:
          - 'next'
          - 'react'
          - 'react-dom'
      typescript:
        patterns:
          - 'typescript'
          - '@types/*'

  # Native/Mobile app (React Native + Expo)
  - package-ecosystem: 'npm'
    directory: '/apps/native'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'mobile'
    groups:
      expo:
        patterns:
          - 'expo*'
      react-native:
        patterns:
          - 'react-native*'
          - '@react-native/*'
      react:
        patterns:
          - 'react'
          - 'react-dom'

  # Backend package (Convex)
  - package-ecosystem: 'npm'
    directory: '/packages/backend'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'backend'
    groups:
      convex:
        patterns:
          - 'convex*'

  # UI package (Shared components)
  - package-ecosystem: 'npm'
    directory: '/packages/ui'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'ui'
    groups:
      react:
        patterns:
          - 'react*'
          - '@types/react*'

  # TypeScript config package
  - package-ecosystem: 'npm'
    directory: '/packages/typescript-config'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'config'

  # ESLint config package
  - package-ecosystem: 'npm'
    directory: '/packages/eslint-config'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'config'
    groups:
      eslint:
        patterns:
          - 'eslint*'
          - '@eslint/*'

  # GitHub Actions dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
      day: 'monday'
      time: '09:00'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'github-actions'

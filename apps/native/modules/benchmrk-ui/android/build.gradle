buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.benchmrkui'
version = '1.0.0'

android {
  namespace "expo.modules.benchmrkui"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
  buildFeatures {
    compose true
  }
}

// Expo UI ships as a prebuilt artifact; compile against the installed version,
// and let the app's own expo-ui dependency provide it at runtime.
def expoUiPackageJson = ["node", "--print", "require.resolve('@expo/ui/package.json')"]
  .execute(null, projectDir).text.trim()
def expoUiVersion = new groovy.json.JsonSlurper().parse(new File(expoUiPackageJson)).version

dependencies {
  compileOnly "expo.modules.ui:expo.modules.ui:${expoUiVersion}"
  implementation 'androidx.compose.foundation:foundation-android:1.10.6'
  implementation 'androidx.compose.ui:ui-android:1.10.6'
  implementation 'androidx.compose.material3:material3-android:1.5.0-alpha17'
}
